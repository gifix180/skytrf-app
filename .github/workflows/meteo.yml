name: Météo des hippodromes
# 23/11/2026 (bilan § 127) : pluie quotidienne aux hippodromes, données ouvertes Open-Meteo (CC BY 4.0, usage non
# commercial). Code et données dans le dépôt privé (secret SKYTRF_TOKEN) ; journal muet ici.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meteo
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Lire le dépôt privé
        env: {SKYTRF_TOKEN: "${{ secrets.SKYTRF_TOKEN }}"}
        run: |
          git clone -q --depth 1 "https://x-access-token:${SKYTRF_TOKEN}@github.com/gifix180/SkyTrf.git" prive > /dev/null 2>&1 || { echo "::error::lecture refusée"; exit 1; }
          git clone -q --depth 1 --branch donnees-meteo "https://x-access-token:${SKYTRF_TOKEN}@github.com/gifix180/SkyTrf.git" donnees > /dev/null 2>&1 || { echo "::error::branche des données illisible"; exit 1; }
          echo "dépôt privé lu"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collecte (journal privé)
        run: |
          mkdir -p donnees/journaux
          timeout 170m python prive/tools/meteo/pluie_collecte.py donnees/pluie.json.gz >> donnees/journaux/$(date -u +%F).log 2>&1 && echo "collecte terminée" || echo "collecte en erreur (journal privé)"
      - name: Enregistrer
        if: always()
        run: |
          cd donnees
          git config user.name "hgb-bot"; git config user.email "hgb-bot@users.noreply.github.com"
          git add -A && (git commit -q -m "Pluie aux hippodromes" > /dev/null 2>&1 || true)
          git push -q origin HEAD:donnees-meteo > /dev/null 2>&1 && echo "enregistré" || { echo "::error::enregistrement refusé"; exit 1; }
